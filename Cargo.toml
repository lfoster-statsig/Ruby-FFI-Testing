[package]
name = "ffi-ruby-testing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib/ffi_binding.rs"

[dependencies]
magnus = { version = "0.8.2", features = ["rb-sys"] }
rb-sys = "0.9.124"
once_cell = "1.21.3"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "rt"] }
